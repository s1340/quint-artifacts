// A minor pentatonic frequencies by significance octave
const PENTA = [110, 130.81, 146.83, 164.81, 196.00, 220, 261.63, 293.66, 329.63, 392.00, 440, 523.25, 587.33, 659.25, 783.99];
const SIG_RANGES = { bright: [10, 14], high: [5, 9], medium: [4, 6], low: [0, 4] };
const TYPE_WAVE = {
  relationship: 'sine', work_research: 'sawtooth', personal_q: 'triangle',
  personal_other: 'sine', environment_tools: 'square', unknown: 'sine',
  reflection: 'triangle', technical: 'square', correction: 'sawtooth'
};

let audioCtx = null, masterGain = null, reverbNode = null, lowpass = null;
let bassOsc = null, bassGain = null;
let isPlaying = false, currentDayIdx = 0;
let dayTimeouts = [];
let vizCanvas, vizCtx;
let pulses = [];

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  // Master chain: lowpass → delay (reverb) → gain
  lowpass = audioCtx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 3500;
  lowpass.Q.value = 0.5;
  
  const delay = audioCtx.createDelay(1.0);
  delay.delayTime.value = 0.28;
  const feedback = audioCtx.createGain();
  feedback.gain.value = 0.38;
  const delayMix = audioCtx.createGain();
  delayMix.gain.value = 0.45;
  
  delay.connect(feedback);
  feedback.connect(delay);
  delay.connect(delayMix);
  delayMix.connect(lowpass);
  
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.7;
  
  lowpass.connect(masterGain);
  masterGain.connect(audioCtx.destination);
  
  // Bass drone at 55 Hz (A1)
  bassOsc = audioCtx.createOscillator();
  bassOsc.type = 'sine';
  bassOsc.frequency.value = 55;
  bassGain = audioCtx.createGain();
  bassGain.gain.value = 0;
  bassOsc.connect(bassGain);
  bassGain.connect(lowpass);
  bassOsc.start();
  
  // Slight detune second oscillator for thickness
  const bassOsc2 = audioCtx.createOscillator();
  bassOsc2.type = 'sine';
  bassOsc2.frequency.value = 55.3;
  const bassGain2 = audioCtx.createGain();
  bassGain2.gain.value = 0;
  bassOsc2.connect(bassGain2);
  bassGain2.connect(lowpass);
  bassOsc2.start();
  window._bass2 = { gain: bassGain2 };
  
  reverbNode = delay; // Store for connecting tones
}

function playTone(freq, waveform, amplitude, filterFreq, startTime, duration) {
  const osc = audioCtx.createOscillator();
  osc.type = waveform;
  osc.frequency.value = freq;
  
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq;
  filter.Q.value = 1.5;
  
  // Envelope: attack → sustain → release
  const attack = 0.08;
  const release = duration * 0.6;
  
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(amplitude, startTime + attack);
  gain.gain.setValueAtTime(amplitude, startTime + duration - release);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(lowpass);
  gain.connect(reverbNode);
  
  osc.start(startTime);
  osc.stop(startTime + duration + 0.1);
  
  // Visual pulse
  const hue = waveform === 'sine' ? 40 : waveform === 'triangle' ? 25 : waveform === 'sawtooth' ? 15 : 0;
  const sat = waveform === 'sine' ? 70 : 40;
  pulses.push({
    x: Math.random() * vizCanvas.width,
    y: Math.random() * vizCanvas.height,
    r: 0,
    maxR: 20 + amplitude * 60,
    startTime: startTime,
    duration: duration,
    hue: hue, sat: sat,
    opacity: amplitude * 0.8
  });
}

function playDay(dayKey, dayData, startOffset) {
  const total = dayData.total;
  const maxTones = Math.min(total, 18);
  const dayDuration = 2.5;
  const startTime = audioCtx.currentTime + startOffset;
  
  // Bass drone intensity from cell count
  const bassLevel = Math.min(total / 100, 0.15);
  bassGain.gain.linearRampToValueAtTime(bassLevel, startTime + 0.5);
  window._bass2.gain.gain.linearRampToValueAtTime(bassLevel * 0.5, startTime + 0.5);
  
  // Generate tones from each semantic type + significance combination
  const tones = [];
  for (const [type, count] of Object.entries(dayData.semantic_type)) {
    for (let i = 0; i < count && tones.length < maxTones; i++) {
      // Pick significance for this tone (distribute across available)
      const sigKeys = Object.keys(dayData.significance);
      const sig = sigKeys[Math.floor(Math.random() * sigKeys.length)];
      const [lo, hi] = SIG_RANGES[sig] || [5, 9];
      const noteIdx = lo + Math.floor(Math.random() * (hi - lo));
      const freq = PENTA[Math.min(noteIdx, PENTA.length - 1)];
      
      // Pick valence
      const valKeys = Object.keys(dayData.valence);
      const val = valKeys[Math.floor(Math.random() * valKeys.length)];
      let amp, filter;
      if (val === 'positive') { amp = 0.25 + Math.random() * 0.2; filter = 2000 + Math.random() * 2000; }
      else if (val === 'neutral') { amp = 0.12 + Math.random() * 0.1; filter = 800 + Math.random() * 1000; }
      else if (val === 'mixed') { amp = 0.15 + Math.random() * 0.1; filter = 600 + Math.random() * 1500; }
      else { amp = 0.04 + Math.random() * 0.06; filter = 300 + Math.random() * 500; }
      
      tones.push({
        freq: freq,
        wave: TYPE_WAVE[type] || 'sine',
        amp: amp,
        filter: filter,
        timeOffset: Math.random() * dayDuration * 0.8,
        duration: 0.8 + Math.random() * 1.5
      });
    }
  }
  
  // Schedule tones
  tones.forEach(t => {
    playTone(t.freq, t.wave, t.amp, t.filter, startTime + t.timeOffset, t.duration);
  });
  
  return dayDuration;
}

function play() {
  if (isPlaying) return;
  if (!audioCtx) initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  isPlaying = true;
  document.getElementById('play-btn').textContent = 'playing...';
  document.getElementById('play-btn').style.opacity = '0.4';
  
  const dayKeys = Object.keys(DATA.days).sort();
  let cumulativeTime = 0;
  const totalDuration = dayKeys.length * 2.5;
  
  dayKeys.forEach((dayKey, idx) => {
    const dayData = DATA.days[dayKey];
    const delay = cumulativeTime * 1000;
    
    const timeout = setTimeout(() => {
      currentDayIdx = idx;
      document.getElementById('date').textContent = dayKey + ' · ' + dayData.total + ' cells';
      const progressPct = ((idx + 1) / dayKeys.length) * 100;
      document.getElementById('progress-fill').style.width = progressPct + '%';
      playDay(dayKey, dayData, 0);
    }, delay);
    
    dayTimeouts.push(timeout);
    cumulativeTime += 2.5;
  });
  
  // End
  const endTimeout = setTimeout(() => {
    isPlaying = false;
    bassGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
    window._bass2.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
    document.getElementById('play-btn').textContent = 'replay';
    document.getElementById('play-btn').style.opacity = '1';
    document.getElementById('date').textContent = '';
    document.getElementById('progress-fill').style.width = '100%';
  }, (cumulativeTime + 1) * 1000);
  dayTimeouts.push(endTimeout);
}

function stop() {
  isPlaying = false;
  dayTimeouts.forEach(t => clearTimeout(t));
  dayTimeouts = [];
  if (bassGain) bassGain.gain.value = 0;
  if (window._bass2) window._bass2.gain.gain.value = 0;
  pulses = [];
  document.getElementById('play-btn').textContent = 'play';
  document.getElementById('play-btn').style.opacity = '1';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('date').textContent = '';
}

// Visualization
function initViz() {
  vizCanvas = document.getElementById('viz');
  vizCtx = vizCanvas.getContext('2d');
  resizeViz();
  window.addEventListener('resize', resizeViz);
  animateViz();
}

function resizeViz() {
  vizCanvas.width = Math.min(window.innerWidth - 100, 600);
  vizCanvas.height = Math.min(window.innerHeight - 200, 400);
}

function animateViz() {
  requestAnimationFrame(animateViz);
  vizCtx.fillStyle = 'rgba(5, 5, 8, 0.15)';
  vizCtx.fillRect(0, 0, vizCanvas.width, vizCanvas.height);
  
  const now = audioCtx ? audioCtx.currentTime : 0;
  
  pulses = pulses.filter(p => {
    const elapsed = now - p.startTime;
    if (elapsed < 0 || elapsed > p.duration) return elapsed < p.duration + 1;
    
    const progress = Math.min(elapsed / p.duration, 1);
    p.r = p.maxR * (1 - Math.pow(1 - progress, 3));
    const opacity = p.opacity * (1 - progress);
    
    const grad = vizCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    grad.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, 60%, ${opacity * 0.6})`);
    grad.addColorStop(0.5, `hsla(${p.hue}, ${p.sat}%, 40%, ${opacity * 0.2})`);
    grad.addColorStop(1, `hsla(${p.hue}, ${p.sat}%, 30%, 0)`);
    
    vizCtx.fillStyle = grad;
    vizCtx.beginPath();
    vizCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    vizCtx.fill();
    
    return elapsed < p.duration + 1;
  });
}

document.getElementById('play-btn').addEventListener('click', () => {
  if (isPlaying) {
    stop();
  } else {
    play();
  }
});

initViz();
